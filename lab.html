<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>sticker lab</title>
    <style>
      :root {
        --ink: #0a0a0a;
        --body: #525252;
        --faint: #8a8a8a;
        --line: #e4e4e4;
        --surface: #f4f4f4;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #fff;
        color: var(--body);
        font: 13px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .lab {
        display: grid;
        grid-template-columns: 380px 1fr;
        min-height: 100vh;
      }
      .panel {
        position: sticky;
        top: 0;
        height: 100vh;
        overflow-y: auto;
        padding: 32px 28px 120px;
        border-right: 1px solid var(--line);
        overscroll-behavior: contain;
      }
      .header {
        position: sticky;
        top: -32px;
        z-index: 2;
        margin: -32px -28px 8px;
        padding: 32px 28px 16px;
        background: rgba(255, 255, 255, 0.92);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid var(--line);
      }
      .title {
        margin: 0;
        color: var(--ink);
        font-size: 20px;
        font-weight: 600;
        letter-spacing: -0.01em;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 14px;
      }
      .button {
        height: 30px;
        padding: 0 12px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fff;
        color: var(--ink);
        font: inherit;
        font-weight: 500;
        cursor: pointer;
        transition: transform 160ms cubic-bezier(0.23, 1, 0.32, 1), border-color 150ms ease;
      }
      .button:active {
        transform: scale(0.97);
      }
      .button[data-primary="true"] {
        border-color: var(--ink);
        background: var(--ink);
        color: #fff;
      }
      @media (hover: hover) and (pointer: fine) {
        .button:hover:not([data-primary="true"]) {
          border-color: #c8c8c8;
        }
      }
      .status {
        min-height: 16px;
        margin: 10px 0 0;
        color: var(--faint);
        font-size: 12px;
      }
      .group {
        padding: 28px 0 8px;
      }
      .group-title {
        margin: 0 0 4px;
        color: var(--ink);
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .group-note {
        margin: 0 0 6px;
        color: var(--faint);
        font-size: 12px;
      }
      .row {
        display: grid;
        grid-template-columns: 112px 1fr 64px;
        align-items: center;
        gap: 12px;
        min-height: 34px;
      }
      .row > :nth-child(2):last-child {
        grid-column: 2 / 4;
        justify-self: start;
      }
      .value {
        color: var(--ink);
        font-variant-numeric: tabular-nums;
        text-align: right;
        white-space: nowrap;
      }
      .unit {
        margin-left: 2px;
        color: var(--faint);
      }
      .range {
        --p: 50%;
        width: 100%;
        height: 20px;
        margin: 0;
        background: transparent;
        appearance: none;
        -webkit-appearance: none;
        cursor: pointer;
      }
      .range::-webkit-slider-runnable-track {
        height: 3px;
        border-radius: 3px;
        background: linear-gradient(to right, var(--ink) var(--p), var(--line) var(--p));
      }
      .range::-moz-range-track {
        height: 3px;
        border-radius: 3px;
        background: linear-gradient(to right, var(--ink) var(--p), var(--line) var(--p));
      }
      .range::-webkit-slider-thumb {
        width: 14px;
        height: 14px;
        margin-top: -5.5px;
        border: 2px solid var(--ink);
        border-radius: 50%;
        background: #fff;
        appearance: none;
        -webkit-appearance: none;
      }
      .range::-moz-range-thumb {
        width: 10px;
        height: 10px;
        border: 2px solid var(--ink);
        border-radius: 50%;
        background: #fff;
      }
      .choice {
        display: flex;
        flex-wrap: wrap;
        gap: 2px;
        padding: 2px;
        border-radius: 8px;
        background: var(--surface);
      }
      .option {
        height: 26px;
        padding: 0 9px;
        border: 0;
        border-radius: 6px;
        background: transparent;
        color: var(--body);
        font: inherit;
        font-size: 12px;
        cursor: pointer;
      }
      .option[aria-checked="true"] {
        background: #fff;
        color: var(--ink);
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.08), 0 0 0 1px rgba(0, 0, 0, 0.04);
      }
      .switch {
        position: relative;
        width: 34px;
        height: 20px;
        padding: 0;
        border: 0;
        border-radius: 20px;
        background: var(--line);
        cursor: pointer;
        transition: background-color 180ms ease;
      }
      .switch::after {
        content: "";
        position: absolute;
        top: 2px;
        left: 2px;
        width: 16px;
        height: 16px;
        border-radius: 50%;
        background: #fff;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
        transition: transform 200ms cubic-bezier(0.23, 1, 0.32, 1);
      }
      .switch[aria-checked="true"] {
        background: var(--ink);
      }
      .switch[aria-checked="true"]::after {
        transform: translateX(14px);
      }
      .well {
        position: relative;
        width: 26px;
        height: 26px;
        overflow: hidden;
        border-radius: 50%;
        box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.18);
      }
      .well input {
        position: absolute;
        inset: -8px;
        width: 42px;
        height: 42px;
        padding: 0;
        border: 0;
        cursor: pointer;
      }
      .main {
        display: grid;
        place-items: center;
        min-height: 100vh;
        background-color: #fafafa;
        background-image: radial-gradient(rgba(10, 10, 10, 0.14) 1px, transparent 1px);
        background-size: 18px 18px;
      }
      .stage {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 28px;
      }
      .stage-box {
        position: relative;
      }
      .stage-art {
        position: absolute;
        max-width: none;
        pointer-events: none;
        user-select: none;
        filter: drop-shadow(0 2px 2px rgba(0, 0, 0, 0.12)) drop-shadow(0 12px 24px rgba(0, 0, 0, 0.08));
      }
      .stage-eyes {
        position: absolute;
        inset: 0;
      }
      .stage-eyes .eye {
        position: absolute;
        border-radius: 50%;
        background: radial-gradient(circle at 42% 36%, rgba(0, 0, 0, 0) 0 58%, rgba(0, 0, 0, 0.13) 100%), var(--white);
        box-shadow: 0 0 0 var(--outline) rgba(10, 10, 10, 0.55), 0 1px 1.5px rgba(0, 0, 0, 0.35);
        pointer-events: none;
      }
      .stage-eyes .pupil {
        position: absolute;
        border-radius: 50%;
      }
      .stage-eyes .glint {
        position: absolute;
        top: 14%;
        left: 20%;
        width: 30%;
        height: 20%;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.8);
        transform: rotate(-35deg);
      }
      .handle {
        position: absolute;
        border: 1px dashed rgba(10, 10, 10, 0.35);
        border-radius: 50%;
        cursor: grab;
        touch-action: none;
      }
      .handle:active {
        cursor: grabbing;
        border-color: var(--ink);
      }
      .knob {
        position: absolute;
        width: 14px;
        height: 14px;
        margin: -7px 0 0 -1px;
        border: 2px solid var(--ink);
        border-radius: 50%;
        background: #fff;
        cursor: ew-resize;
        touch-action: none;
      }
      .stage-note {
        margin: 0;
        color: var(--faint);
      }
      @media (max-width: 900px) {
        .lab {
          grid-template-columns: 1fr;
        }
        .panel {
          position: static;
          height: auto;
          border-right: 0;
        }
        .main {
          order: -1;
          min-height: 520px;
        }
      }
    </style>
  </head>
  <body>
    <div class="lab">
      <aside class="panel" id="panel"></aside>
      <main class="main"><div class="stage" id="stage"></div></main>
    </div>
    <script type="module">
      import { createBoard } from "./sticker/sticker.js";
      import { mountLab } from "./sticker/lab.js";

      const board = createBoard({ appear: "load" });
      const sticker = board.add({
        src: "examples/face.webp",
        eyes: { left: { x: 0.399, y: 0.362 }, right: { x: 0.59, y: 0.36 } },
      });
      mountLab({ panel: document.getElementById("panel"), stage: document.getElementById("stage"), board, sticker });
      window.board = board;
    </script>
  </body>
</html>
